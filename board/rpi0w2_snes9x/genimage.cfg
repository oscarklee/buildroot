image boot.vfat {
  vfat {
    files = {
      "bootcode.bin",
      "start.elf",
      "fixup.dat",
      "config.txt",
      "cmdline.txt",
      "zImage",
      "bcm2710-rpi-zero-2-w.dtb",
      "overlays"
    }
  }
  size = 32M
}

image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}
